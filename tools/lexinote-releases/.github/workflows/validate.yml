name: validate community plugins

on:
  pull_request:
    paths:
      - 'community-plugins.json'
      - 'zips/**'
      - 'scripts/validate.mjs'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate index structure (schemaVersion=1)
        run: node scripts/validate.mjs
      - name: Validate zip hashes against served bytes
        run: node scripts/validate.mjs --remote
