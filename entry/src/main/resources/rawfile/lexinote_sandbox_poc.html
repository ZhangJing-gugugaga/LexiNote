<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- RFC §14 T0.2 Sandbox PoC 宿主页。
       本页是宿主侧：按 RFC §3.2 为每个插件上下文创建独立 sandboxed iframe
       （sandbox="allow-scripts"，无 allow-same-origin / 无 allow-top-navigation），
       每上下文一条专属 MessageChannel；身份绑定发生在宿主侧端口表，绝不送进 iframe。
       验收：恶意探针（lexinote_sandbox_probe.js）在上下文内穷举逃逸路径，全部被阻断。
       本页自身不需要 eval：script-src 只开 'self'，unsafe-eval 只属于沙箱 iframe。

       Round 8/9 真机修正（B-008）：
       1) 引导逻辑不得内联——'self' 不含内联，内联曾被 CSP 全拦导致 PoC 静默；
          逻辑外置到 lexinote_sandbox_poc.js（script-src 'self' 放行）。
       2) iframe 文档必须显式放行——default-src 'none' 下无 child-src/frame-src
          则 lexinote_plugin_sandbox.html 根本不会被请求；'self' 即 rawfile 同源。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; child-src 'self'; frame-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>lexinote-sandbox-poc</title>
  <script src="lexinote_sandbox_probe.js"></script>
</head>
<body>
<div id="lexi-sandbox-poc-summary">sandbox PoC booting…</div>
<script src="lexinote_sandbox_poc.js"></script>
</body>
</html>
