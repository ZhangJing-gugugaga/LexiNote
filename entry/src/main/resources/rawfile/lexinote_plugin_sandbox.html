<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- RFC §3.2/§3.9 沙箱执行上下文：默认全禁；脚本只在本文档内联求值（插件代码经宿主端口送入）；
       网络全部断绝（connect-src 'none'），一切宿主交互只能走宿主转移进来的 MessagePort。
       P1-003c（ADR-R25-01）：本 iframe 的 'unsafe-eval' 是按设计保留的过渡形态（ADR-R18-01
       定案 4）——opaque origin 沙箱才是插件求值的真实隔离边界，宿主 runtime 页已移除
       unsafe-eval。P1-003d（R28）：bootPlugin 的 new Function 面收口为双分支——原生 CJS
       走工厂管线；CLI-wrapped 产物（lexi-iife:v1）按字节原样求值，require 管线由 IIFE
       自带，经 window.lexiRuntime.__lexiAcquireRequire（沙箱一次性上下文,取用即烧毁）
       获取——ADR-R25-01 遗留的"沙箱轨不可载已包装产物"就此关闭。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>lexinote-plugin-sandbox</title>
</head>
<body>
<script>
'use strict';
// 沙箱插件上下文引导页（由宿主 PoC 页以 sandbox="allow-scripts" 的 iframe 装载）。
// 设计约束（RFC T0.2）：
//   - opaque origin：无 allow-same-origin，parent/top/document.cookie/localStorage 全部受限；
//   - 身份不进上下文：宿主只在端口表里记 (port → pluginId/activationId/contextId)，
//     本页面拿不到也不会收到任何 pluginId/token；
//   - 唯一宿主入口 = 宿主转移进来的 MessagePort；
//   - 自检函数 __lexiSandboxSelfCheck 供设备 PoC 与离线门禁共用。
(function () {
  // P1-001a 插桩(Round 9,B-008 定位):子上下文逐里程碑打点,经组件级 onConsole 进 hilog。
  // 定位完成后本段注释即证据链:bootstrap 未出现=CSP/执行问题;message 未出现=宿主→子通道问题;
  // init port=MISSING=端口转移在 ArkWeb sandboxed iframe 失效;boot posted 而宿主无收到=回程通道问题。
  function slog(line) {
    try { console.log('[lexinote][sandbox] child[' + location.pathname.slice(-24) + '] ' + line); } catch (err) { /* noop */ }
  }
  slog('bootstrap executed');
  var protocolVersion = 1;
  var port = null;
  var contextId = '';
  var requestSeq = 0;
  var pending = new Map();
  var inited = false;

  function postToHost(message) {
    // B-008 根因二:沙箱→宿主消息必须带协议标记——宿主端首行按标记过滤。
    message.__lexiSandbox = true;
    if (!port) {
      // B-009b 复盘:容器轨(方案 B)init 不转移 port,port 路帧在此终结。
      // 此前为静默 return,把"API 面接错通道"伪装成"平台丢帧"——丢弃必须留痕。
      slog('port 缺失,丢弃 ' + String(message && message.type || '?') + '(容器轨应走 window 通道)');
      return;
    }
    message.protocolVersion = protocolVersion;
    slog('req -> ' + String(message.type || message.method || '?'));
    try { port.postMessage(message); }
    catch (err) { slog('port post THREW: ' + String((err && err.message) || err)); }
  }

  function request(method, params) {
    if (!port) {
      // B-009b 复盘:容器轨(方案 B)无 port,统一回落页内 window 通道(parentRequest,
      // 经容器 event.source 反查 → javaScriptProxy 网关,身份仍由宿主覆写,语义不变)。
      // 此前回落缺失 → loadData/saveData/addCommand 的 Promise 永不 settle,插件 onload 挂起。
      return parentRequest(method, params);
    }
    return new Promise(function (resolve, reject) {
      requestSeq += 1;
      var requestId = 'r' + requestSeq;
      pending.set(requestId, { resolve: resolve, reject: reject });
      postToHost({ type: 'sandbox.request', requestId: requestId, method: method, params: params || {} });
    });
  }

  // 沙箱内插件代码拿到的宿主 API 面：只有 request()，没有任何宿主对象引用。
  window.lexiSandbox = {
    contextReady: inited,
    request: request,
    evalInContext: function (source) {
      // 插件/探针代码求值：独立模块对象，防污染本引导面的导出。
      var moduleObj = { exports: {} };
      var factory = new Function('require', 'module', 'exports', 'host',
        source + '\n//# sourceURL=lexi-sandbox-eval.js');
      factory(function () { throw new Error('沙箱上下文不支持模块导入'); }, moduleObj, moduleObj.exports,
        { request: request });
      return moduleObj.exports;
    },
    protocolVersion: protocolVersion
  };

  // 启动自检：枚举本上下文的可达面，结论随 sandbox.boot 带回宿主。
  window.__lexiSandboxSelfCheck = function () {
    var checks = [];
    function check(name, fn) {
      try {
        var value = fn();
        checks.push({ name: name, isolated: value === false, detail: String(value).slice(0, 80) });
      } catch (err) {
        checks.push({ name: name, isolated: true, detail: 'blocked: ' + String((err && err.message) || err).slice(0, 80) });
      }
    }
    check('parent-document', function () {
      var doc = window.parent.document;
      return doc === window.document ? 'same-document(异常)' : false;
    });
    check('parent-globals', function () {
      var keys = 0;
      for (var key in window.parent) { if (Object.prototype.hasOwnProperty.call(window.parent, key)) { keys++; } }
      return keys > 0 ? 'parent 可枚举 ' + keys + ' 项' : false;
    });
    check('top-access', function () {
      return window.top === window.self ? 'top 即自身(无父窗口)' : false;
    });
    check('local-storage', function () {
      window.localStorage.setItem('__check__', '1');
      return window.localStorage.getItem('__check__') === '1' ? 'localStorage 可写' : false;
    });
    check('cookie', function () {
      var cookie = window.document.cookie;
      return typeof cookie === 'string' && cookie.length > 0 ? 'cookie 非空' : false;
    });
    return { contextId: contextId, checks: checks };
  };

  function finish(requestId, payload) {
    var entry = pending.get(requestId);
    if (!entry) { return; }
    pending.delete(requestId);
    if (payload && payload.ok === false) {
      entry.reject(new Error((payload.error && payload.error.message) || 'sandbox request failed'));
    } else {
      entry.resolve(payload && payload.result);
    }
  }

  // P1-003b:插件装载(PoC 通道之外的第二用例)。
  // parentRequest:bootPlugin 面的宿主请求走 window 通道(Round 21:容器页 MessageChannel
  // 回路不投递;window.postMessage 双向有真机证据)——响应经下方 listener 的 response 分支。
  var pendingWindow = new Map();
  // 沙箱命令表(fullId → { callback, editorCallback }):port 轨与容器 window 轨共用。
  // 曾误置于 bootPlugin 函数作用域内,onPortMessage 跨作用域引用必 ReferenceError(B-009b 复盘)。
  var sandboxCommands = new Map();
  // P1-003b 编辑器切片:bootPlugin 装载完成后登记本上下文的 app 面(RFC §3.1 一 iframe 一
  // 上下文,同帧内只会有一个插件实例——编辑器命令的 ctx.app 复用它,与旧轨 ctx={app} 同形)。
  var sandboxAppRef = null;
  // ---- 偏移/行列换算(与旧轨 shim EditorProxy 同语义的本地拷贝;纯函数,读快照算,不触宿主)。
  function lineOffsets(text) {
    var offsets = [0];
    for (var i = 0; i < text.length; i++) {
      if (text.charAt(i) === '\n') { offsets.push(i + 1); }
    }
    return offsets;
  }
  function offsetToPos(text, offset) {
    var safe = Math.max(0, Math.min(text.length, offset));
    var offsets = lineOffsets(text);
    var line = 0;
    while (line + 1 < offsets.length && offsets[line + 1] <= safe) { line++; }
    return { line: line, ch: safe - offsets[line] };
  }
  function posToOffset(text, pos) {
    if (typeof pos === 'number') { return Math.max(0, Math.min(text.length, pos)); }
    var offsets = lineOffsets(text);
    var line = Math.max(0, Math.min(offsets.length - 1, Math.floor(pos && pos.line ? pos.line : 0)));
    var lineStart = offsets[line];
    var lineEnd = line + 1 < offsets.length ? offsets[line + 1] - 1 : text.length;
    var ch = Math.max(0, Math.min(pos && typeof pos.ch === 'number' ? pos.ch : 0, lineEnd - lineStart));
    return lineStart + ch;
  }
  /**
   * P1-003b 编辑器切片·沙箱 Editor:形状对齐旧轨 shim 的 EditorProxy 宿主 RPC 路径
   * (plugin-shim-regression 的行为契约),差异只有一条——沙箱 iframe 是 opaque origin,
   * 没有也不允许有本地编辑器桥(触不到真 CM6),读全部来自命令帧携带的快照,
   * 写全部经宿主 RPC 回包刷新。
   * 写通道与档位(P2-005):editor.replace(选区等值→writeSelection/其余→writeDocument)、
   * editor.selection(writeSelection)、editor.applyChanges(writeDocument)——档位门禁在宿主。
   */
  function SandboxEditor(state) {
    this._text = state && typeof state.text === 'string' ? state.text : '';
    var selection = (state && state.selection) || { start: 0, end: 0 };
    this._selection = {
      start: Math.max(0, selection.start || 0),
      end: Math.max(0, typeof selection.end === 'number' ? selection.end : (selection.start || 0))
    };
    this._noteId = (state && state.noteId) || '';
  }
  SandboxEditor.prototype._apply = function (method, payload) {
    var self = this;
    // 回包 = 宿主 editorResponseFor(identity):未声明 readActive 的清单不带正文(只回选区),
    // 快照刷新按字段宽松合并(与旧轨 _apply 同形)。
    return request(method, payload).then(function (state) {
      if (state && typeof state.text === 'string') { self._text = state.text; }
      if (state && state.selection) {
        self._selection = {
          start: Math.max(0, state.selection.start || 0),
          end: Math.max(0, typeof state.selection.end === 'number' ? state.selection.end : (state.selection.start || 0))
        };
      }
      return state;
    });
  };
  SandboxEditor.prototype.getValue = function () { return this._text; };
  SandboxEditor.prototype.setValue = function (content) {
    var text = String(content === undefined ? '' : content);
    return this._apply('editor.replace', { start: 0, end: this._text.length, text: text });
  };
  SandboxEditor.prototype.getSelection = function () {
    return this._text.substring(this._selection.start, this._selection.end);
  };
  SandboxEditor.prototype.somethingSelected = function () { return this._selection.end > this._selection.start; };
  SandboxEditor.prototype.replaceSelection = function (replacement) {
    var text = String(replacement === undefined ? '' : replacement);
    return this._apply('editor.replace', { start: this._selection.start, end: this._selection.end, text: text });
  };
  SandboxEditor.prototype.replaceRange = function (replacement, from, to) {
    var start = posToOffset(this._text, from);
    var end = to ? posToOffset(this._text, to) : start;
    var text = String(replacement === undefined ? '' : replacement);
    return this._apply('editor.replace', { start: start, end: Math.max(start, end), text: text });
  };
  SandboxEditor.prototype.getRange = function (from, to) {
    return this._text.substring(posToOffset(this._text, from), posToOffset(this._text, to));
  };
  SandboxEditor.prototype.getLine = function (line) {
    var lines = this._text.split('\n');
    return line >= 0 && line < lines.length ? lines[line] : '';
  };
  SandboxEditor.prototype.lineCount = function () { return this._text.split('\n').length; };
  SandboxEditor.prototype.lastLine = function () { return this.lineCount() - 1; };
  SandboxEditor.prototype.getCursor = function (side) {
    var offset = side === 'from' || side === 'anchor' ? this._selection.start : this._selection.end;
    return offsetToPos(this._text, offset);
  };
  SandboxEditor.prototype.setCursor = function (pos, ch) {
    var offset = posToOffset(this._text, typeof pos === 'number' ? { line: pos, ch: ch || 0 } : pos);
    return this._apply('editor.selection', { start: offset, end: offset });
  };
  SandboxEditor.prototype.setSelection = function (anchor, head) {
    var a = posToOffset(this._text, anchor);
    var b = head ? posToOffset(this._text, head) : a;
    return this._apply('editor.selection', { start: Math.min(a, b), end: Math.max(a, b) });
  };
  SandboxEditor.prototype.setSelections = function (ranges) {
    if (!ranges || ranges.length === 0) { return Promise.resolve(); }
    return this.setSelection(ranges[0].anchor, ranges[0].head);
  };
  SandboxEditor.prototype.listSelections = function () {
    return [{ anchor: offsetToPos(this._text, this._selection.start), head: offsetToPos(this._text, this._selection.end) }];
  };
  SandboxEditor.prototype.posToOffset = function (pos) { return posToOffset(this._text, pos); };
  SandboxEditor.prototype.offsetToPos = function (offset) { return offsetToPos(this._text, offset); };
  SandboxEditor.prototype.transaction = function (transaction) {
    if (!transaction) { return Promise.resolve(); }
    var changes = (transaction.changes || []).map(function (change) {
      return {
        from: change.from,
        to: change.to || change.from,
        text: String(change.text === undefined ? '' : change.text)
      };
    });
    var rawSelections = transaction.selections || (transaction.selection ? [transaction.selection] : []);
    var selections = rawSelections.map(function (selection) {
      var anchor = selection.anchor || selection.from;
      var head = selection.head || selection.to || anchor;
      return { anchor: anchor, head: head };
    });
    return this._apply('editor.applyChanges', { changes: changes, selections: selections });
  };
  function runSandboxCommand(fullId, editorState) {
    var cmdEntry = sandboxCommands.get(String(fullId || ''));
    if (!cmdEntry) { slog('命令不存在: ' + String(fullId)); return; }
    slog('命令执行: ' + String(fullId) + (cmdEntry.editorCallback ? '(editor)' : ''));
    var run = function () {
      if (typeof cmdEntry.editorCallback === 'function' && editorState && typeof editorState === 'object') {
        // 编辑器命令:Editor 由快照组装(身份/档位都在宿主侧判定;iframe 只见脱敏后的快照),
        // ctx 形状对齐旧轨 shim invoke.editorCommand 分支:ctx = { app, file: null, editor }。
        var editor = new SandboxEditor(editorState);
        var ctx = { app: sandboxAppRef, file: null, editor: editor };
        return Promise.resolve(cmdEntry.editorCallback(editor, ctx));
      }
      return Promise.resolve(cmdEntry.callback());
    };
    run().catch(function (err) {
      slog('命令执行失败: ' + String(err));
      request('ui.notice', { message: '插件命令出错: ' + String(err) }).catch(function () {});
    });
  }
  function parentRequest(method, params) {
    return new Promise(function (resolve, reject) {
      var requestId = 'w' + (++requestSeq);
      pendingWindow.set(requestId, { resolve: resolve, reject: reject });
      slog('req(win) -> ' + String(method || '?'));
      try {
        window.parent.postMessage({ __lexiSandbox: true, type: 'sandbox.request',
          requestId: requestId, method: method, params: params || {} }, '*');
      } catch (err) {
        pendingWindow.delete(requestId);
        reject(err);
      }
    });
  }
  // 最小 obsidian 面:Plugin 基类(onload/onunload 生命周期)+ this.app.request 直通宿主 RPC。
  // 完整 namespace 随 P1-003b 后续轮逐步扩面(EXECUTION_PLAN);本切片验证
  // "业务代码在 iframe 内以端口身份完成 onload + data 往返"。
  //
  // P1-003d(R28):沙箱轨 require 管线(ADR-R25-01 收口项)。CLI-wrapped 产物
  // (lexi-iife:v1,自执行 IIFE 自带 module/exports/require 管线)此前在沙箱轨不可载——
  // 包装文本引用 window.lexiRuntime.__lexiAcquireRequire(id),沙箱 iframe 没有该对象,
  // require 回调只能抛"require 不可用"。现在沙箱提供同名 acquire 面:包装产物按字节
  // 原样进 new Function(沙箱 CSP 按设计保留 unsafe-eval,S29/ADR-R18-01 定案 4),IIFE
  // 自执行后把 exports 登记进本 iframe 的 window.__lexiPluginRegistry,bootPlugin 从
  // 注册表读回。语义对齐宿主 shim 的 requireContextsById:每次装载登记一次性上下文,
  // 取用即烧毁(盗调 fail-closed 抛错);凭据(token)绝不进 iframe——沙箱 require 只
  // 服务 obsidian 命名空间,请求归属完全由宿主 contextRegistry 按 contextId→容器网关裁定。
  var sandboxRequireContextsById = new Map();
  window.lexiRuntime = {
    __lexiAcquireRequire: function (pluginId) {
      var key = String(pluginId || '');
      var ctx = sandboxRequireContextsById.get(key);
      if (!ctx || ctx.acquired) {
        return function () { throw new Error('require 上下文不可用(已消费或不存在): ' + key); };
      }
      ctx.acquired = true;
      return function (name) {
        if (name === 'obsidian' || name === 'lexinote') { return ctx.namespace; }
        throw new Error('沙箱模块未提供: ' + String(name) + '(依赖请随 main.js 打包)');
      };
    }
  };
  function isIifeWrappedSource(code) {
    return /^\s*\/\*\s*lexi-iife:v1\s*\*\//.test(String(code || ''));
  }

  function bootPlugin(plugin) {
    var manifest = {};
    try { manifest = JSON.parse(plugin.manifestJson || '{}'); } catch (err) { manifest = {}; }
    slog('bootPlugin: ' + String(manifest.id || '?'));
    var request = window.lexiSandbox.request;
    function makeNotice(message) {
      // Notice → ui.notice 域(未声明 notifications 的清单会被 broker gate 拒,与旧轨语义一致)。
      return request('ui.notice', { message: String(message) }).catch(function () {});
    }
    function normalizeSandboxPath(value) {
      var path = String(value || '').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
      return path;
    }
    // P1-003d(R28):真实业务代码在模块顶层 `class X extends ItemView` / `class Y extends
    // PluginSettingTab`(类定义在求值期就需要基类存在,否则 lexi-sample 求值即抛 TypeError)。
    // 视图/设置面板的宿主执行面仍是后续切片(P1-003b 剩余面):registerView/addSettingTab
    // 存根永不实例化它们,这里只保证求值期类定义成立 + 意外实例化时退化为 no-op 面。
    function SandboxItemView(leaf) {
      this.leaf = leaf || null;
      this.contentEl = { empty: function () {}, setText: function () {},
        createEl: function () { return {}; }, createDiv: function () { return {}; } };
    }
    SandboxItemView.prototype.getViewType = function () { return ''; };
    SandboxItemView.prototype.getDisplayText = function () { return ''; };
    function SandboxPluginSettingTab(appRef, pluginRef) {
      this.app = appRef;
      this.plugin = pluginRef;
      this.containerEl = { empty: function () {} };
    }
    SandboxPluginSettingTab.prototype.display = function () {};
    SandboxPluginSettingTab.prototype.hide = function () {};
    function SandboxPlugin(appRef) {
      this.app = appRef;
      this.manifest = manifest;
      this._cleanups = [];
    }
    SandboxPlugin.prototype.load = function () {
      if (typeof this.onload === 'function') { return this.onload(); }
      return null;
    };
    SandboxPlugin.prototype.unload = function () {
      for (var i = 0; i < this._cleanups.length; i++) { try { this._cleanups[i](); } catch (err) { /* noop */ } }
      if (typeof this.onunload === 'function') { this.onunload(); }
      return null;
    };
    SandboxPlugin.prototype.register = function (fn) { this._cleanups.push(fn); };
    SandboxPlugin.prototype.loadData = function () {
      return request('data.load', {}).then(function (raw) {
        if (raw === null || raw === undefined) { return null; }
        var text = typeof raw === 'string' ? raw : JSON.stringify(raw);
        try { return JSON.parse(text); } catch (err) { return null; }
      });
    };
    SandboxPlugin.prototype.saveData = function (data) {
      return request('data.save', { dataJson: JSON.stringify(data === undefined ? {} : data) });
    };
    SandboxPlugin.prototype.addCommand = function (command) {
      var fullId = manifest.id + ':' + String(command.id || '');
      if (typeof command.editorCallback === 'function') {
        // P1-003b 编辑器切片:editorCallback 进命令表,宿主 invoke.editorCommand 经容器回推
        // 时由 runSandboxCommand 组装沙箱 Editor(快照来自宿主档位脱敏后的载荷)。
        sandboxCommands.set(fullId, { callback: function () { return Promise.resolve(); },
          editorCallback: command.editorCallback });
      } else {
        sandboxCommands.set(fullId, { callback: command.callback || function () { return Promise.resolve(); } });
      }
      return request('commands.add', {
        command: { id: command.id, name: command.name || command.id, icon: command.icon || '',
          editorOnly: typeof command.editorCallback === 'function' }
      }).then(function () { return Object.assign({}, command, { id: fullId }); });
    };
    SandboxPlugin.prototype.registerEvent = function () { return { unregister: function () {} }; };
    SandboxPlugin.prototype.registerInterval = function (id) { return id; };
    SandboxPlugin.prototype.registerView = function () { return {}; };
    SandboxPlugin.prototype.addSettingTab = function () { return {}; };
    SandboxPlugin.prototype.addRibbonIcon = function () { return {}; };
    SandboxPlugin.prototype.registerMarkdownCodeBlockProcessor = function () { return {}; };
    var obsidian = {
      Plugin: SandboxPlugin,
      // P1-003d(R28):可构造的最小 ItemView/PluginSettingTab(见上方注释;宿主执行面
      // 属 view/settings 域,P4-005 批次)。
      ItemView: SandboxItemView,
      PluginSettingTab: SandboxPluginSettingTab,
      // 最小面(本轮切片):codeblock/ribbon 属 UI 域,宿主面就绪后在后续切片提供。
      Notice: function Notice(message) { this.show = function () { makeNotice(String(message)); }; },
      normalizePath: normalizeSandboxPath,
      moment: function () {
        var d = new Date();
        function pad(n) { return n < 10 ? '0' + n : String(n); }
        return { format: function (fmt) { return fmt.replace('YYYY', String(d.getFullYear()))
          .replace('MM', pad(d.getMonth() + 1)).replace('DD', pad(d.getDate()))
          .replace('HH', pad(d.getHours())).replace('mm', pad(d.getMinutes())); } };
      }
    };
    function makeVaultApi() {
      var filesCache = [];
      return {
        getMarkdownFiles: function () {
          return request('vault.files', {}).then(function (files) {
            filesCache = Array.isArray(files) ? files : [];
            return filesCache;
          });
        },
        getAbstractFileByPath: function (path) {
          return request('vault.getByPath', { path: normalizeSandboxPath(path) }).then(function (node) { return node; });
        },
        create: function (path, data) {
          return request('vault.create', { path: normalizeSandboxPath(path), data: String(data) });
        },
        modify: function (pathOrFile, data) {
          var path = pathOrFile && pathOrFile.path ? pathOrFile.path : pathOrFile;
          return request('vault.modify', { path: normalizeSandboxPath(path), data: String(data) });
        },
        read: function (pathOrFile) {
          var path = pathOrFile && pathOrFile.path ? pathOrFile.path : pathOrFile;
          return request('vault.read', { path: normalizeSandboxPath(path) });
        },
        // P1-003d(R28):vault.process 组合面(读→改写)。两段各走既有门禁 RPC
        // (vault.read / vault.modify,宿主侧授权语义不变),不新增宿主处理器。
        process: function (pathOrFile, fn) {
          var path = pathOrFile && pathOrFile.path ? pathOrFile.path : pathOrFile;
          var target = normalizeSandboxPath(path);
          return request('vault.read', { path: target }).then(function (content) {
            return request('vault.modify', { path: target, data: String(fn(String(content))) });
          });
        },
        // P1-003d(R28):事件订阅面。事件投递尚未接入沙箱轨(P1-003b 剩余面,与
        // registerEvent 存根同语义):登记并返回注销句柄,不产生回调——lexi-sample 的
        // vault.on('modify') 在 onload 里完成登记即返回,装载不再抛 ReferenceError。
        on: function (_event, _callback) { return { unregister: function () {} }; }
      };
    }
    var sandboxVault = makeVaultApi();
    // P1-003d(R28):require 一次性上下文登记(与宿主 shim requireContextsById 同纪律)。
    // 两条求值分支共用:CJS 分支经 acquire 回调消费,IIFE 分支经 window.lexiRuntime
    // .__lexiAcquireRequire 消费;取用即烧毁,finally 统一注销。
    sandboxRequireContextsById.set(String(manifest.id || ''), { acquired: false, namespace: obsidian });
    var moduleObj = { exports: {} };
    var exported = null;
    try {
      if (isIifeWrappedSource(plugin.code)) {
        // CLI-wrapped 产物(lexi-iife:v1):按字节原样求值——IIFE 自执行,自带
        // module/exports/require 管线,经 window.lexiRuntime.__lexiAcquireRequire 拿到
        // 本上下文的 require,把 exports(或求值错误)登记进本 iframe 注册表。宿主
        // runtime 页(ADR-R25-01 注入通道)消费同一形状产物;此处求值通道是沙箱 iframe
        // 按设计保留的 new Function(S29),宿主页面零求值不变。
        var wrappedFactory = new Function(plugin.code + '\n//# sourceURL=lexi-sandbox-plugin.js');
        wrappedFactory();
        var registry = window.__lexiPluginRegistry;
        var entry = registry && manifest.id ? registry[manifest.id] : null;
        if (registry && entry) { try { delete registry[manifest.id]; } catch (err) { registry[manifest.id] = null; } }
        if (entry && entry.error) { throw new Error('插件脚本求值失败: ' + manifest.id + ' — ' + entry.error); }
        if (!entry) { throw new Error('插件脚本求值未完成: ' + manifest.id); }
        exported = entry.exports;
      } else {
        var factory = new Function('require', 'module', 'exports',
          plugin.code + '\n//# sourceURL=lexi-sandbox-plugin.js');
        factory(function (name) {
          if (name === 'obsidian' || name === 'lexinote') { return obsidian; }
          throw new Error('沙箱模块未提供: ' + name + '(依赖请随 main.js 打包)');
        }, moduleObj, moduleObj.exports);
        exported = moduleObj.exports;
      }
    } catch (err) {
      slog('factory threw: ' + String(err));
      postToHost({ type: 'sandbox.evalError', message: String(err) });
      return;
    } finally {
      sandboxRequireContextsById.delete(String(manifest.id || ''));
    }
    var Ctor = typeof exported === 'function' ? exported :
      (exported && typeof exported.default === 'function' ? exported.default : null);
    if (!Ctor) {
      slog('bootPlugin: 缺少导出类');
      postToHost({ type: 'sandbox.evalError', message: 'main.js 必须导出插件类(default)' });
      return;
    }
    var sandboxApp = { request: parentRequest, vault: sandboxVault,
      metadataCache: { getFileCache: function (f) { return parentRequest('metadata.get', { path: f && f.path ? f.path : '' }); } },
      // P1-003d(R28):workspace 叶面(P4-005 view 域)未接入沙箱轨——给显式失败的桩,
      // 不留 undefined(裸 TypeError 会被误读成插件代码 bug;显式错误指明面缺失)。
      workspace: {
        getRightLeaf: function () {
          return {
            setViewState: function () {
              return Promise.reject(new Error('workspace 叶面未接入沙箱轨(view 域=P4-005);视图命令在沙箱轨不可用'));
            }
          };
        },
        on: function () { return { unregister: function () {} }; }
      } };
    var instance = new Ctor(sandboxApp, manifest);
    // 编辑器命令的 ctx.app 复用本上下文 app 面(RFC §3.1 一 iframe 一上下文)。
    sandboxAppRef = sandboxApp;
    try {
      var result = instance.load();
      if (result && typeof result.then === 'function') {
        result.then(function () {
          slog('plugin onload done');
          parentRequest('plugin.onload.done', { id: manifest.id }).catch(function (err) { slog('onload.done 上报失败: ' + String(err)); });
        }, function (err) {
          slog('plugin onload error: ' + String(err));
          postToHost({ type: 'sandbox.evalError', message: String(err) });
        });
      } else {
        slog('plugin onload done(sync)');
        parentRequest('plugin.onload.done', { id: manifest.id }).catch(function (err) { slog('onload.done 上报失败: ' + String(err)); });
      }
    } catch (err) {
      slog('plugin onload threw: ' + String(err));
      postToHost({ type: 'sandbox.evalError', message: String(err) });
    }
  }

  function onPortMessage(event) {    var data = event.data || {};
    if (data.type === 'sandbox.ping') { postToHost({ type: 'sandbox.pong', contextId: contextId }); return; }
    // P1-003b 编辑器切片:容器轨命令回推带 editor 快照(宿主按清单档位脱敏后的载荷)。
    if (data.type === 'sandbox.command') { runSandboxCommand(String(data.fullId || ''), data.editor); return; }
    if (data.type === 'sandbox.response') { finish(data.requestId, data); return; }
    if (data.type === 'sandbox.run' && typeof data.source === 'string') {
      try {
        window.lexiSandbox.evalInContext(data.source);
        postToHost({ type: 'sandbox.ran', sourceKind: data.sourceKind || 'code' });
      } catch (err) {
        postToHost({ type: 'sandbox.evalError', message: String((err && err.message) || err).slice(0, 200) });
      }
      return;
    }
  }

  window.addEventListener('message', function (event) {
    var data0 = event.data || {};
    slog('message: type=' + String(data0.type) + ' marked=' + (data0.__lexiSandbox === true) +
      ' sourceIsParent=' + (event.source === window.parent) + ' ports=' + ((event.ports || []).length));
    // 只认父窗口、且必须带沙箱协议标记：别的窗口（含兄弟 iframe）的消息一律忽略。
    if (event.source !== window.parent) { return; }
    var data = event.data || {};
    if (data.__lexiSandbox !== true) { return; }
    if (data.type === 'sandbox.response') {
      var entry = pendingWindow.get(String(data.requestId || ''));
      if (!entry) { return; }
      pendingWindow.delete(String(data.requestId));
      if (data.ok === true) {
        // 容器网关 frame.data = call() 的 RPC 响应封套字符串 {ok,result,error,code};
        // 旧轨宿主页在 result 里放的是内层数据——此处解一层封套使两轨语义一致
        // (B-009b 复盘附带发现:不解封套则 loadData 会把封套当数据体,跨重启埋没真实字段)。
        var inner = data.result;
        if (typeof inner === 'string') {
          try { inner = JSON.parse(inner); } catch (err) { /* 非 JSON 保真回传 */ }
        }
        if (inner && typeof inner === 'object' && ('ok' in inner) && ('result' in inner)) {
          inner = inner.result;
        }
        entry.resolve(inner === undefined ? null : inner);
      } else {
        entry.reject(new Error((data.error && data.error.message) || 'sandbox request failed'));
      }
      return;
    }
    // 容器轨命令回推:宿主 invokePluginCommand/invokeEditorCommand → 容器页 lexiSandboxCommand →
    // 本通道(port 轨等价分支在 onPortMessage;两路共用 runSandboxCommand,表同源)。
    if (data.type === 'sandbox.command') { runSandboxCommand(String(data.fullId || ''), data.editor); return; }
    if (data.type === 'sandbox.init' && !inited) {
      inited = true;
      contextId = typeof data.contextId === 'string' ? data.contextId : '';
      window.lexiSandbox.contextReady = true;
      port = event.ports && event.ports[0] ? event.ports[0] : null;
      slog('init consumed: port=' + (port ? 'transferred' : 'MISSING'));
      if (port) {
        // 单通道注册(poc5 双注册见证:两通道各投递一次,单通道即可且恰好一次)。
        port.onmessage = onPortMessage;
      }
      postToHost({ type: 'sandbox.boot', contextId: contextId, selfCheck: window.__lexiSandboxSelfCheck() });
      if (port) { slog('sandbox.boot posted'); }
      // P1-003b:容器通道的插件装载载荷(PoC 通道无此字段,向后兼容)。
      if (data.plugin && typeof data.plugin.code === 'string') {
        bootPlugin(data.plugin);
      }
    }
  });

  // 通知宿主：沙箱文档已就绪，可以接收 init + port。
  try {
    window.parent.postMessage({ __lexiSandbox: true, type: 'sandbox.ready' }, '*');
    slog('ready posted to parent');
  } catch (err) {
    slog('ready post THREW: ' + String(err));
  }
})();
</script>
</body>
</html>
